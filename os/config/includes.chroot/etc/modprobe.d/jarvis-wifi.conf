# The Mac mini's Wi-Fi chip (Broadcom BCM4331, 14e4:4331) uses the proprietary wl
# driver (2.4 and 5 GHz). Keep the open-source drivers that would otherwise grab
# the chip from loading, because only one driver can own it.
blacklist b43
blacklist b43legacy
blacklist brcmsmac
blacklist brcmfmac
blacklist ssb
blacklist bcma
