name: Voice bench

# Can the 2010 Core 2 Duo run a local command recogniser? See voice/bench.sh and
# docs/adr/0005-voice-architecture.md. Downloads are hash-checked.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - voice/**
      - .github/workflows/voice-bench.yml

permissions:
  contents: read

jobs:
  stt:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends espeak-ng sox libsox-fmt-all qemu-user unzip binutils build-essential curl
      - name: Run the benchmark (first run learns the download hashes)
        env:
          ALLOW_UNPINNED: "1"
        run: bash voice/bench.sh
