name: Voice bench

# Can the 2010 Core 2 Duo run a local command recogniser? See
# docs/adr/0005-voice-architecture.md. The chosen candidate (PocketSphinx) runs
# on every change to voice/; the two that failed (prebuilt Vosk, whisper.cpp)
# stay available by hand as evidence: voice-bench-rejected.yml.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - voice/**
      - .github/workflows/voice-bench.yml

permissions:
  contents: read

jobs:
  pocketsphinx:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: PocketSphinx in Debian trixie, native and as an emulated Core 2
        run: docker run --rm -v "$PWD:/w" debian:trixie bash /w/voice/bench-pocketsphinx.sh
