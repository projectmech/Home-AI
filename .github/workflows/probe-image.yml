name: Probe image

# Builds the JARVIS Probe ISO (a small read-only hardware inspection medium,
# docs/PROBE.md) and boots it in QEMU as a Core 2 class CPU, once with BIOS and
# once with UEFI, with a USB stick named REPORT attached.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - probe/**
      - .github/workflows/probe-image.yml

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build the probe ISO
        run: bash probe/build.sh --out out
      - name: Keep the ISO
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-probe-iso
          path: |
            out/jarvis-probe-amd64.iso
            out/jarvis-probe-amd64.iso.sha256
          if-no-files-found: ignore
          retention-days: 14

  boot:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mode: [bios, efi]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: jarvis-probe-iso
          path: out
      - name: Install QEMU and tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils ovmf socat mtools dosfstools
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules || true
          sudo udevadm trigger --name-match=kvm || true
      - name: Boot test (${{ matrix.mode }})
        run: bash probe/test-boot.sh out/jarvis-probe-amd64.iso ${{ matrix.mode }} 420
      - name: Keep the serial log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-serial-${{ matrix.mode }}
          path: probe-serial-*.log
          if-no-files-found: ignore
          retention-days: 14
