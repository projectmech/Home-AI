name: llama.cpp bench

# Can llama.cpp built for a Core 2 (no AVX) run a model? See llm/llamacpp-bench.sh
# and docs/AI.md. Independent of llm-bench.yml (which tests Ollama's own binary).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - llm/llamacpp-bench.sh
      - .github/workflows/llamacpp-bench.yml

permissions:
  contents: read

jobs:
  llamacpp:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake git curl jq bc binutils qemu-user
      - name: Build llama-server for a Core 2 and run it, natively and emulated
        run: bash llm/llamacpp-bench.sh
