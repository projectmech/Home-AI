name: Release

# Runs when a version tag (v1.2.3) is pushed. Builds the Core 2 Duo baseline
# binary and the frontend, packages them, signs the bundle with Sigstore
# keyless signing, installs it for real to prove the installer accepts it, and
# publishes a GitHub release.
#
# No signing key is stored anywhere. Sigstore issues a short-lived certificate
# to this workflow's GitHub OIDC identity, and install.sh accepts only bundles
# signed by this file, in this repository, on a version tag
# (RELEASE_IDENTITY_REGEXP in packaging/lib.sh). Renaming this file, the
# repository or its owner requires updating that expression first.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write   # create the release
  id-token: write   # GitHub OIDC token for Sigstore

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: bash ../scripts/ci-run.sh svelte-check npm run check
        working-directory: web
      - run: npm run build
        working-directory: web

      - run: rustup show
      - run: bash scripts/ci-run.sh test cargo test --all
      - run: bash scripts/ci-run.sh release-build cargo build --release --target x86_64-unknown-linux-gnu

      - name: Tag must match the binary's version
        run: |
          BIN=target/x86_64-unknown-linux-gnu/release/home-ai
          VERSION=$("$BIN" version | awk '{print $2}')
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the version in server/Cargo.toml ($VERSION)."
            exit 1
          fi

      - run: bash scripts/ci-run.sh smoke bash scripts/smoke.sh target/x86_64-unknown-linux-gnu/release/home-ai web/dist

      - name: Package
        run: bash scripts/package.sh target/x86_64-unknown-linux-gnu/release/home-ai web/dist dist

      - name: Sign with Sigstore (keyless) and verify as the installer does
        run: bash scripts/ci-run.sh sign bash scripts/release-sign.sh dist/home-ai-*-linux-x86_64.tar.gz

      # sudo does not pass CI=true, so this is the production verification path.
      - name: Install the signed bundle for real, then remove it
        run: |
          bash scripts/ci-run.sh install sudo ./install.sh --bundle "$(ls dist/home-ai-*-linux-x86_64.tar.gz)"
          systemctl is-active --quiet home-ai
          sudo ./uninstall.sh --purge --yes

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/home-ai-*-linux-x86_64.tar.gz \
            dist/home-ai-*-linux-x86_64.tar.gz.sigstore.json \
            --title "$GITHUB_REF_NAME" --generate-notes
