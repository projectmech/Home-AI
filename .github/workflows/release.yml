name: Release

# Runs when a version tag (v1.2.3) is pushed. Builds the Core 2 Duo baseline
# binary and the frontend, packages and signs them, and publishes a GitHub
# release. Needs the repository secret RELEASE_SIGNING_KEY (docs/INSTALL.md).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refuse to release without a signing key
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "$RELEASE_SIGNING_KEY" ]; then
            echo "::error::Secret RELEASE_SIGNING_KEY is not set. See docs/INSTALL.md."
            exit 1
          fi
          test -f packaging/release-signing.pub.pem || {
            echo "::error::packaging/release-signing.pub.pem is missing from the repository."
            exit 1
          }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci && npm run check && npm run build
        working-directory: web

      - run: rustup show
      - run: cargo test --all
      - run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Tag must match the binary's version
        run: |
          BIN=target/x86_64-unknown-linux-gnu/release/home-ai
          VERSION=$("$BIN" version | awk '{print $2}')
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo version $VERSION."
            exit 1
          fi

      - run: bash scripts/smoke.sh target/x86_64-unknown-linux-gnu/release/home-ai web/dist

      - name: Package and sign
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          umask 077
          KEY=$(mktemp)
          trap 'rm -f "$KEY"' EXIT
          printf '%s\n' "$RELEASE_SIGNING_KEY" > "$KEY"
          RELEASE_SIGNING_KEY_FILE="$KEY" bash scripts/package.sh \
            target/x86_64-unknown-linux-gnu/release/home-ai web/dist dist
          # The signature must verify with the public key in the repository.
          openssl pkeyutl -verify -pubin -inkey packaging/release-signing.pub.pem \
            -rawin -in dist/SHA256SUMS -sigfile dist/SHA256SUMS.sig

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS dist/SHA256SUMS.sig \
            --title "$GITHUB_REF_NAME" --generate-notes
