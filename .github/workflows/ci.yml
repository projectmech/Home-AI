name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the version and components.
      - run: rustup show
      - run: bash scripts/ci-run.sh fmt cargo fmt --all -- --check
      - run: bash scripts/ci-run.sh clippy cargo clippy --all-targets -- -D warnings
      - run: bash scripts/ci-run.sh test cargo test --all
      # Release build for the Core 2 Duo baseline (.cargo/config.toml sets
      # target-cpu=x86-64). A real Mac mini smoke test is still required.
      - run: bash scripts/ci-run.sh release-build cargo build --release --target x86_64-unknown-linux-gnu
      - run: ./target/x86_64-unknown-linux-gnu/release/home-ai hwdiag
      - uses: actions/upload-artifact@v4
        with:
          name: home-ai-linux-x86_64-baseline
          path: target/x86_64-unknown-linux-gnu/release/home-ai

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: bash ../scripts/ci-run.sh svelte-check npm run check
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist

  # Runs the built release binary for real: HTTPS, setup token, setup, login,
  # a device command, and a restart. Simulator only.
  smoke:
    needs: [rust, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: home-ai-linux-x86_64-baseline
          path: out/bin
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: out/web
      - run: chmod +x out/bin/home-ai
      - run: bash scripts/ci-run.sh smoke bash scripts/smoke.sh out/bin/home-ai out/web

  # Real install on a throwaway runner with systemd: bad bundles refused,
  # install, setup, crash recovery, update, rollback, uninstall, purge.
  install:
    needs: [rust, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: home-ai-linux-x86_64-baseline
          path: out/bin
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: out/web
      - run: chmod +x out/bin/home-ai
      - run: bash -n install.sh && bash -n update.sh && bash -n uninstall.sh && bash -n get.sh && bash -n packaging/lib.sh
      - run: bash scripts/ci-run.sh install-test bash scripts/test-install.sh out/bin/home-ai out/web
      - name: get.sh against the real v0.1.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci-run.sh get-test bash scripts/test-get.sh
