name: Voice bench (Vosk and whisper.cpp recheck)

# By hand only. Earlier runs of these two on the ubuntu-latest runner stopped with
# an illegal instruction under an emulated Core 2, and I concluded they needed AVX.
# A later run showed the stop is at the SAME bytes in every program, including a
# source-built llama.cpp with no AVX at all: the runner's own C library requires a
# newer CPU than a Core 2 ("CPU does not support x86-64-v3" on an emulated
# SandyBridge). So those results said nothing about the programs. This reruns them
# inside debian:trixie (the OS image's base), whose C library runs on a Core 2.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vosk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Vosk in Debian trixie
        run: |
          docker run --rm -v "$PWD:/w" -w /w debian:trixie bash -c '
            apt-get update -qq &&
            apt-get install -y -qq --no-install-recommends espeak-ng sox libsox-fmt-all qemu-user unzip binutils build-essential curl ca-certificates > /dev/null &&
            qemu-x86_64 -cpu Penryn /bin/true && echo "::notice title=control::an ordinary Debian program runs on an emulated Core 2" ;
            bash voice/bench.sh'

  whisper:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: whisper.cpp in Debian trixie
        run: |
          docker run --rm -v "$PWD:/w" -w /w debian:trixie bash -c '
            apt-get update -qq &&
            apt-get install -y -qq --no-install-recommends espeak-ng sox libsox-fmt-all qemu-user binutils build-essential cmake git curl bc ca-certificates > /dev/null &&
            bash voice/bench-whisper.sh'
