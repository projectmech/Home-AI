name: LLM bench

# Can the 2010 Core 2 Duo run Ollama (the local model service)? See llm/bench.sh.
#
# History: runs on the ubuntu runner said the official binary "needs
# x86-64-v3", but the runner's own C library stops every program on an emulated
# Core 2 (another session found this). The job therefore runs inside
# debian:trixie, whose libc is baseline x86-64 and is what the OS image uses.
# In Debian the official v0.40.16 server answered on an emulated Core 2.
# llm/build-ollama.sh (build from source) is kept for reference but is not run:
# it is not needed.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - llm/**
      - .github/workflows/llm-bench.yml

permissions:
  contents: read

jobs:
  ollama-official:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Official Ollama natively and as an emulated Core 2 (inside debian:trixie)
        run: |
          docker run --rm -v "$PWD:/w" -w /w debian:trixie bash -ec '
            apt-get update -qq
            apt-get install -y --no-install-recommends qemu-user zstd jq binutils curl ca-certificates >/dev/null
            echo "control: /bin/true on an emulated Core 2:"
            QEMU_CPU=Penryn qemu-x86_64 -cpu Penryn /bin/true && echo "control passed"
            bash llm/bench.sh'
