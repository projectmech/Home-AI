name: LLM bench

# Can the 2010 Core 2 Duo run Ollama (the local model service)? See
# llm/bench.sh. Downloads are hash-checked; the first runs learn the hash to pin.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - llm/**
      - .github/workflows/llm-bench.yml

permissions:
  contents: read

jobs:
  ollama:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-user zstd jq binutils curl ca-certificates
      - name: Ollama natively and as an emulated Core 2
        run: bash llm/bench.sh
