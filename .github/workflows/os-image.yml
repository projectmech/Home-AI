name: OS image

# Builds the JARVIS OS live ISO from the newest published signed release and
# boots THAT ISO (no test hooks) in QEMU as a Core 2-class CPU, once with BIOS
# and once with EFI, checking what a person and a browser would see.
# See docs/adr/0004-jarvis-os-architecture.md and docs/LIVE-TEST.md.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - os/**
      - packaging/home-ai.service
      - packaging/lib.sh
      - .github/workflows/os-image.yml

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Get the newest signed release bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh release list --limit 10 --json tagName,isDraft --jq '[.[] | select(.isDraft | not)][0].tagName')
          echo "release: $TAG"
          mkdir -p release
          gh release download "$TAG" --dir release \
            --pattern 'home-ai-*-linux-x86_64.tar.gz' \
            --pattern 'home-ai-*-linux-x86_64.tar.gz.sigstore.json'
          ls -l release

      - name: Build the ISO (verifies the bundle with Sigstore first)
        run: bash scripts/ci-run.sh os-build bash os/build.sh --bundle "$(ls release/home-ai-*-linux-x86_64.tar.gz)" --out out

      # Kept even when a boot test fails, so the image can be inspected.
      - name: Keep the ISO
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-os-live-iso
          path: |
            out/jarvis-os-amd64.iso
            out/jarvis-os-amd64.iso.sha256
          if-no-files-found: ignore
          retention-days: 14

      - name: Show the boot menu configuration inside the ISO
        if: always()
        run: |
          sudo apt-get install -y --no-install-recommends xorriso >/dev/null
          mkdir -p isox
          xorriso -osirrox on -indev out/jarvis-os-amd64.iso \
            -extract /isolinux isox/isolinux -extract /boot/grub isox/grub 2>&1 | tail -n 3 || true
          {
            echo '### Boot menu configuration inside the ISO'
            for f in isox/isolinux/*.cfg isox/grub/config.cfg isox/grub/grub.cfg; do
              [ -f "$f" ] || continue
              echo "#### $f"; echo '```'; head -n 70 "$f"; echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"
          MSG=$( { echo "files: $(ls isox/isolinux 2>/dev/null | tr '\n' ' ') | $(ls isox/grub 2>/dev/null | tr '\n' ' ')"; grep -HiE '^[[:space:]]*(timeout|default|ontimeout|prompt|menu default|label|include)|set (timeout|default)' isox/isolinux/*.cfg isox/grub/config.cfg isox/grub/grub.cfg 2>/dev/null | head -n 40; } | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::warning title=boot menu settings found in the ISO::$MSG"

      - name: Inspect the finished ISO (required and forbidden contents)
        run: |
          sudo apt-get install -y --no-install-recommends squashfs-tools xorriso >/dev/null
          mkdir -p inspect
          xorriso -osirrox on -indev out/jarvis-os-amd64.iso -extract /live/filesystem.squashfs inspect/fs.squashfs >/dev/null 2>&1
          unsquashfs -l inspect/fs.squashfs > inspect/files.txt
          unsquashfs -cat inspect/fs.squashfs var/lib/dpkg/status > inspect/dpkg-status.txt
          SIZE=$(stat -c %s out/jarvis-os-amd64.iso)
          SHA=$(cut -d' ' -f1 out/jarvis-os-amd64.iso.sha256)
          PKGS=$(grep -c '^Package:' inspect/dpkg-status.txt)
          KERNEL=$(grep -oE 'lib/modules/[0-9][^/]*' inspect/files.txt | sort -u | head -n 1 | cut -d/ -f3)
          CORE=$(unsquashfs -cat inspect/fs.squashfs opt/home-ai/VERSION | head -n 1)
          fail=0
          : > inspect/report.txt
          need()   { if grep -qE "$1" inspect/files.txt; then echo "present: $2" >> inspect/report.txt; else echo "MISSING: $2" >> inspect/report.txt; fail=1; fi; }
          forbid() { if grep -qE "$1" inspect/files.txt; then echo "FORBIDDEN PRESENT: $2" >> inspect/report.txt; fail=1; else echo "absent: $2" >> inspect/report.txt; fi; }
          need 'squashfs-root/opt/home-ai/bin/home-ai$' 'JARVIS core binary'
          need 'squashfs-root/opt/home-ai/web/index.html$' 'dashboard'
          need 'squashfs-root/etc/systemd/system/home-ai.service$' 'home-ai service unit'
          need 'squashfs-root/etc/systemd/system/jarvis-banner.service$' 'console banner unit'
          need 'squashfs-root/usr/local/lib/jarvis/banner.sh$' 'console banner script'
          need 'squashfs-root/usr/local/bin/home-ai$' 'admin command'
          need 'drivers/net/ethernet/nvidia/forcedeth\.ko' 'Mac mini Ethernet driver (forcedeth)'
          need 'systemd/systemd-networkd$' 'DHCP (systemd-networkd)'
          need '(sbin|bin)/avahi-daemon$' 'jarvis.local (avahi)'
          need 'bin/lspci$' 'lspci (network chip listing)'
          need 'bin/curl$' 'curl'
          forbid '(sbin|bin)/sshd$' 'SSH server'
          forbid 'usr/bin/sudo$' 'sudo'
          forbid 'etc/sudoers\.d/jarvis-admin' 'sudoers entry for jarvis-admin'
          forbid 'squashfs-root/home/jarvis-admin' 'jarvis-admin account home'
          forbid 'etc/ssh/authorized_keys' 'built-in SSH keys'
          {
            echo '### Finished ISO'
            echo "- size: $SIZE bytes"; echo "- sha256: $SHA"; echo "- kernel: $KERNEL"
            echo "- JARVIS core: $CORE"; echo "- installed packages: $PKGS"
            echo '```'; cat inspect/report.txt; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          MSG=$( { echo "size=$SIZE sha256=$SHA kernel=$KERNEL core=$CORE packages=$PKGS"; cat inspect/report.txt; } | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          if [ "$fail" = 0 ]; then echo "::warning title=ISO inspection: all required present, nothing forbidden::$MSG"; else echo "::error title=ISO inspection FAILED::$MSG"; fi
          exit "$fail"

      - name: Install QEMU and firmware
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf socat
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules || true
          sudo udevadm trigger --name-match=kvm || true
          ls -l /dev/kvm || echo "no /dev/kvm: tests run under software emulation"

      - name: Boot test, BIOS
        id: bios
        continue-on-error: true
        run: bash os/test-boot.sh out/jarvis-os-amd64.iso bios 300

      - name: Boot test, EFI
        id: efi
        continue-on-error: true
        run: bash os/test-boot.sh out/jarvis-os-amd64.iso efi 300

      - name: Fail the job if a boot test failed
        if: steps.bios.outcome == 'failure' || steps.efi.outcome == 'failure'
        run: |
          echo "BIOS: ${{ steps.bios.outcome }}  EFI: ${{ steps.efi.outcome }}"
          exit 1

      - name: Show the serial logs on the run page
        if: always()
        run: |
          for m in bios efi; do
            [ -f "serial-$m.log" ] || continue
            {
              echo "### Serial console: $m"
              echo '```'
              tr -d '\r' < "serial-$m.log" | sed -E 's/\x1b\[[0-9;?!]*[a-zA-Z]//g' | strings | tail -n 120
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Keep the serial logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: os-boot-logs
          path: |
            serial-*.log
            screen-*.ppm
          if-no-files-found: ignore
          retention-days: 14
